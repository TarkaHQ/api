name: Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.57.2
          github_token: ${{ github.token }}
      - name: Check protobuf formatting and lint
        run: |
          buf format --diff --exit-code
          buf lint
      - name: Check backward compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against "${{ github.server_url }}/${{ github.repository }}.git#branch=main"
      - name: Regenerate control OpenAPI
        run: buf generate
      - name: Check generated control OpenAPI is committed
        run: git diff --exit-code -- openapi/tarka-control-v1.swagger.json
      - name: Validate OpenAPI contracts
        run: python3 scripts/validate_openapi.py

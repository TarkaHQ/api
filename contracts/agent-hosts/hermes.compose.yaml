x-tarka:
  id: hermes
  title: Hermes Agent
  description: Hermes autonomous agent with persistent memory, scheduling and its web UI.
  version: "2026.5.29-tarka.4"
  tier: core
  routes:
    - service: hermes-webui
      port: 8787
      path: /
  variables:
    - name: HERMES_WEBUI_PASSWORD
      label: Web UI password
      secret: true
      required: true
  runtime_profile:
    managed_model: true
    default_model_alias: qwen3.8-flash-next
    context_token_limit: 81920
    compaction_threshold_tokens: 65536
    utility_modalities: [stt, ocr, tts, embedding, rerank]
    platform_services: [hermes-agent]
  gateways:
    - id: telegram
      title: Telegram
      description: Telegram bot with pairing or an explicit sender allowlist.
      setup_mode: predeploy
      default_config_yaml: |
        enabled: true
        dm_policy: pairing
      variables:
        - name: TELEGRAM_BOT_TOKEN
          label: Bot token
          description: Token issued by BotFather.
          secret: true
          required: true
    - id: discord
      title: Discord
      description: Discord bot for direct messages and selected servers.
      setup_mode: predeploy
      default_config_yaml: |
        enabled: true
        dm_policy: pairing
      variables:
        - name: DISCORD_BOT_TOKEN
          label: Bot token
          description: Bot token from the Discord developer portal.
          secret: true
          required: true
    - id: whatsapp
      title: WhatsApp
      description: Linked WhatsApp device configured after the host is ready.
      setup_mode: postdeploy_pairing
      default_config_yaml: |
        enabled: true
        dm_policy: pairing
    - id: signal
      title: Signal
      description: Dedicated Signal bot number through the managed Signal bridge.
      setup_mode: postdeploy_pairing
      default_config_yaml: |
        enabled: true
        dm_policy: pairing
      variables:
        - name: SIGNAL_ACCOUNT
          label: Bot phone number
          description: Dedicated Signal number in E.164 format.
          required: true
  volume_sizes:
    hermes-home: 10Gi
    hermes-agent-src: 5Gi
    hermes-workspace: 20Gi

services:
  hermes-agent:
    image: nousresearch/hermes-agent@sha256:2f1f2f1725e5dc9a61cf6a2dea5aca52a776ec4d022cb29679e6aa3ff303e77a
    command: gateway run
    environment:
      HERMES_HOME: /home/hermes/.hermes
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      TARKA_API_URL: http://tarka/v1
    volumes:
      - hermes-home:/home/hermes/.hermes
      - hermes-agent-src:/opt/hermes
    healthcheck:
      test: [CMD-SHELL, test -d /home/hermes/.hermes || exit 1]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations: {cpus: "1", memory: 2G}
        limits: {cpus: "3", memory: 6G}
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui@sha256:d6665a09b783a0fcc58136e67cdd40588ca2c21421ea97b3cfc5302d81effbec
    depends_on:
      hermes-agent:
        condition: service_started
    environment:
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      WANTED_UID: "1000"
      WANTED_GID: "1000"
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD}
    volumes:
      - hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - hermes-workspace:/workspace
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:8787/health]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 256M}
        limits: {cpus: "1", memory: 1G}

volumes:
  hermes-home:
  hermes-agent-src:
  hermes-workspace:

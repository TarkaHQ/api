version: v2
modules:
  - path: proto
    name: buf.build/tarkahq/api
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # The established v1 API predates Buf's RPC envelope convention. Changing
    # these message shapes would break existing clients, so enforce every
    # other STANDARD rule while preserving the published wire contract.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE

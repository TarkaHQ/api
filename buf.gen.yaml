version: v2
clean: false
plugins:
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.30.0
    revision: 1
    out: openapi
    types:
      - tarka.provisioning.v1.ProvisioningService
      - tarka.provisioning.v1.SandboxService
      - tarka.iam.v1.IAMService
      - tarka.gateway.v1.GatewayService
      - tarka.access.v1.AccessService
      - tarka.channels.v1.ChannelsService
    opt:
      - allow_merge=true
      - merge_file_name=tarka-control-v1
      - json_names_for_fields=false
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.30.0
    revision: 1
    out: openapi
    types:
      - tarka.inference.v1.InferenceService
    opt:
      - allow_merge=true
      - merge_file_name=tarka-inference-v1
      - json_names_for_fields=false

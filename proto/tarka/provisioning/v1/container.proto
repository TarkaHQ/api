syntax = "proto3";

package tarka.provisioning.v1;

option csharp_namespace = "Tarka.Provisioning.V1";
option go_package = "github.com/TarkaHQ/api/gen/go/tarka/provisioning/v1;provisioningv1";
option java_multiple_files = true;
option java_outer_classname = "ContainerProto";
option java_package = "com.tarka.provisioning.v1";

// A shared input to container workloads. Admission resolves it to an immutable
// OCI image before allocating capacity.
message ContainerSource {
  oneof source {
    string image = 1;
    string template = 2;
    ContainerBuildImage build = 3;
  }
}

message ContainerBuildImage {
  // A completed source build in the caller's organization.
  string build_id = 1;
  // The service name from that build.
  string service = 2;
}

message ContainerTemplate {
  string name = 1;
  string image = 2;
  string description = 3;
}

message ListContainerTemplatesRequest {
  string org_id = 1;
}

message ListContainerTemplatesResponse {
  repeated ContainerTemplate templates = 1;
}

// Registers a scale-to-zero HTTP container in eu-1. Each replica has
// the EU session allocation and rate. The image's entrypoint listens on PORT.
message HTTPServiceSpec {
  string name = 1;
  ContainerSource container = 2;
  // One active replica per service. Zero selects 60 idle seconds.
  int32 idle_timeout_seconds = 3;
  // Bind an update to the currently deployed revision. Zero creates a service.
  uint64 expected_revision = 4;
  // Publish a generated HTTPS endpoint. Omission preserves visibility on updates.
  optional bool public = 5;
}
message InvokeHTTPServiceRequest {
  string org_id = 1;
  string workload_id = 2;
  string method = 3;
  string path = 4;
  string content_type = 5;
  bytes body = 6;
}
message InvokeHTTPServiceResponse {
  int32 status = 1;
  string content_type = 2;
  bytes body = 3;
}
message DeleteHTTPServiceRequest {
  string org_id = 1;
  string workload_id = 2;
  uint64 expected_revision = 3;
}

// The platform services a workload reaches through its private gateway at
// http://tarka. The platform authenticates the workload; code inside the
// container holds no credential. Every compute profile shares this message.
// An unset capability takes the profile default: hosted agents, HTTP services
// and batch jobs enable inference and databases, code sandboxes and container
// sessions enable nothing. Object storage, Hosted Git, the project's API and
// MCP gateways, invoking other compute, and project secrets are disabled for
// every profile until they are enabled for the workload.
message WorkloadAccess {
  // Output only. Zero while the workload still uses its profile defaults.
  uint64 version = 1;
  WorkloadInferenceAccess inference = 2;
  WorkloadDatabaseAccess databases = 3;
  // Optional. Unset authenticates the workload as itself.
  WorkloadIdentity identity = 4;
  WorkloadStorageAccess storage = 5;
  WorkloadGitAccess git = 6;
  WorkloadGatewayAccess gateway = 7;
  WorkloadComputeAccess compute = 8;
  WorkloadEnvironmentAccess environment = 9;
}

// Model access at http://tarka/v1.
message WorkloadInferenceAccess {
  optional bool enabled = 1;
  // Model aliases the workload may call. Empty allows every model the
  // organization may use; a hosted agent is always limited to its configured
  // models.
  repeated string allowed_models = 2;
}

// Record access at http://tarka/database (the workload's own database),
// http://tarka/project/database (the project's default database) and
// http://tarka/databases/{name} (a named database in the workload's project).
message WorkloadDatabaseAccess {
  optional bool enabled = 1;
  // rules or full. Empty selects rules: collection rules decide each call.
  // full bypasses collection rules and requires an owner, admin or operator.
  string mode = 2;
  // The workload's own default database, created on first use. Hosted agents,
  // HTTP services and batch jobs only.
  optional bool own = 3;
  // The project's default database, created on first use.
  optional bool project_default = 4;
  // Named databases. Empty allows read, write and subscribe on every shared
  // database in the project; another workload's own database always needs a
  // grant.
  repeated WorkloadDatabaseGrant grants = 5;
}

message WorkloadDatabaseGrant {
  // Database name in the workload's project.
  string database = 1;
  // read, write or subscribe.
  repeated string actions = 2;
}

// Object access at http://tarka/storage/{bucket}. Disabled for every profile
// until enabled. The platform signs each call with a credential limited to
// the granted bucket; the workload never receives one.
message WorkloadStorageAccess {
  optional bool enabled = 1;
  // Buckets in the workload's project the workload may use. Every bucket must
  // be named: enabling storage without a grant reaches no bucket, and listing
  // grants does not enable storage.
  repeated WorkloadStorageGrant grants = 2;
}

message WorkloadStorageGrant {
  // Bucket name in the workload's project.
  string bucket = 1;
  // read (get, list, and presigned downloads) or write (put, delete, and
  // presigned uploads).
  repeated string actions = 2;
}

// Git smart HTTP at http://tarka/git/{repository}.git. Disabled for every
// profile until enabled. The platform authenticates to Hosted Git with a
// credential limited to the granted repository; the workload never receives
// one.
message WorkloadGitAccess {
  optional bool enabled = 1;
  // Repositories in the workload's project the workload may use. Every
  // repository must be named: enabling Git without a grant reaches no
  // repository, and listing grants does not enable Git.
  repeated WorkloadGitGrant grants = 2;
}

message WorkloadGitGrant {
  // Repository name in the workload's project.
  string repository = 1;
  // read (clone and fetch) or write (push).
  repeated string actions = 2;
}

// The project's API and MCP gateways at http://tarka/mcp and
// http://tarka/api, or http://tarka/gateways/{gateway}/mcp and
// http://tarka/gateways/{gateway}/api when several are granted. Disabled for
// every profile until enabled. The workload calls a gateway as its bound
// identity or, without one, as its own agent identity; the gateway's policy
// and tool grants then decide every call.
message WorkloadGatewayAccess {
  optional bool enabled = 1;
  // Gateways in the workload's project the workload may call, by name or ID.
  // Every gateway must be named: enabling the gateway capability without a
  // gateway reaches none.
  repeated string gateways = 2;
}

// Invoking other compute of the workload's project at http://tarka/compute.
// Disabled for every profile until enabled. Calls are billed and limited
// exactly like calls through the control API, and a chain of workloads
// invoking each other stops at a depth of four.
message WorkloadComputeAccess {
  optional bool enabled = 1;
  // HTTP services (Functions) the workload may invoke, by name.
  repeated string functions = 2;
  // Start runs of the project's jobs and read their status.
  bool jobs = 3;
  // Create short-lived container sessions, run commands in them and delete
  // them. A workload reaches only the sessions it created.
  bool sessions = 4;
}

// Project secrets at http://tarka/environment and
// http://tarka/secrets/{name}. Disabled for every profile until enabled. The
// platform reads a secret when the workload asks for it and never writes it
// into the workload's configuration.
message WorkloadEnvironmentAccess {
  optional bool enabled = 1;
  // Secrets of the workload's project the workload may read, by name. Every
  // secret must be named.
  repeated string secrets = 2;
}

// Binds the workload to an identity in its project's identity scope. The
// principal's roles then decide database and gateway access: read, use, or
// administer for full database access.
message WorkloadIdentity {
  // An active agent or service principal. Requires an owner, admin or operator.
  string principal_id = 1;
  // HTTP services only. Lets the service act for the signed-in project user
  // whose request invoked it, for the duration of that request, when its code
  // sends Tarka-Act-As: invoking-user. The platform holds the user's assertion;
  // the service never receives a token. Requires an owner, admin or operator.
  optional bool act_as_invoking_user = 2;
}

message GetWorkloadAccessRequest {
  string org_id = 1;
  string workload_id = 2;
}

// Replaces the workload's access. Omitted capabilities return to their
// profile defaults.
message SetWorkloadAccessRequest {
  string org_id = 1;
  string workload_id = 2;
  WorkloadAccess access = 3;
  // The version last read. Zero replaces profile defaults only.
  uint64 expected_version = 4;
}

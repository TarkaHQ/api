syntax = "proto3";

package tarka.provisioning.v1;

import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option csharp_namespace = "Tarka.Provisioning.V1";
option go_package = "github.com/TarkaHQ/api/gen/go/tarka/provisioning/v1;provisioningv1";
option java_multiple_files = true;
option java_outer_classname = "RegistryCredentialsProto";
option java_package = "com.tarka.provisioning.v1";

// AgentHostRegistryCredential is metadata only. A saved PAT is never returned.
message AgentHostRegistryCredential {
  string id = 1;
  string label = 2;
  string username = 3;
  string version = 4;
  repeated string services = 5;
}

// AgentHostRegistryCredentialInput is a complete desired credential assignment.
// An existing id/version with an omitted token preserves that saved PAT.
// New/replacement PATs are accepted only through a human-controlled secret input.
message AgentHostRegistryCredentialInput {
  string id = 1;
  string label = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_length: 80}];
  string username = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_length: 39}];
  string token = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    format: "password"
    max_length: 4096
  }];
  string version = 5;
  // Each Compose service may be assigned to at most one credential.
  repeated string services = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_items: 32}];
}

message AgentHostRegistryTestImage {
  string service = 1;
  // Only canonical ghcr.io references are accepted. Images are downloaded,
  // verified and discarded; their entrypoints are never executed.
  string image = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_length: 1024}];
}

// StartAgentHostRegistryTestRequest also supports a new host by name, before
// runtime allocation or billing. Omitted credentials mean anonymous pulls.
message StartAgentHostRegistryTestRequest {
  string org_id = 1;
  string name = 2;
  repeated AgentHostRegistryCredentialInput credentials = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_items: 16}];
  repeated AgentHostRegistryTestImage images = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_items: 32}];
}

message GetAgentHostRegistryTestRequest {
  string org_id = 1;
  string test_id = 2;
}

message CancelAgentHostRegistryTestRequest {
  string org_id = 1;
  string test_id = 2;
}

message AgentHostRegistryTest {
  string id = 1;
  string name = 2;
  // queued, running, succeeded, failed, cancelled, consumed, or expired.
  string status = 3;
  // Bounded, non-secret failure code; never an upstream response body.
  string error_code = 4;
  repeated AgentHostRegistryCredential credentials = 5;
  // Successful checks return immutable image references per Compose service.
  repeated AgentHostRegistryTestImage images = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

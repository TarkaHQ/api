message AgentHostGatewayPairing {
  string gateway_id = 1;
  string content_type = 2;
  bytes data = 3;
  string instructions = 4;
}

// DeleteAgentHostRequest selects an Agent Host visible to the caller.
message DeleteAgentHostRequest {
  string org_id = 1;
  string agent_host_id = 2;
}

// CreateJobRequest defines desired state for a finite-duration container job.
message CreateJobRequest {
  string org_id = 1;
  // name must be a DNS label and is unique per organization/resource type.
  string name = 2;
  // image is a container image reference; embedded credentials are forbidden.
  string image = 3;
  // command is the argv executed in the container without shell expansion.
  repeated string command = 4;
  // timeout_seconds is the execution limit; zero selects the platform default.
  int32 timeout_seconds = 5;
  // spec carries non-secret extension fields. Typed fields take precedence.
  google.protobuf.Struct spec = 6;
  // location is a hard constraint. Omission selects eu-1. US East requires explicit
  // us-1 and accepted_quote_id; there is no automatic US East fallback. The selected
  // location is immutable and returned on the resource and run.
  string location = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    max_length: 16
    pattern: "^([a-z]{2}-[0-9]{1,3})?$"
  }];
  // resources has platform defaults when omitted; zero fields select defaults.
  JobResources resources = 8;
  // retry_policy defaults to one On-Demand attempt with no automatic retries.
  JobRetryPolicy retry_policy = 9;
  // idempotency_key safely retries creation for 24 hours. Reusing a key with
  // changed content is rejected. A new key creates a new immutable revision
  // only after the previous run is terminal.
  string idempotency_key = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_length: 128}];
  // queue_timeout_seconds bounds capacity wait, independently of execution.
  // Zero selects 600 seconds; explicit values must be between 30 and 3600.
  uint32 queue_timeout_seconds = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {maximum: 3600}];
  // Required for us-1; must match the request and be unexpired.
  string accepted_quote_id = 12;
  // Omission defaults to 1 GiB for US East; zero disables networking.
  optional uint64 max_network_bytes = 13;
}

// ProvisionedResource is the recorded desired and observed state for a managed
// resource.
message ProvisionedResource {
  string id = 1;
  string org_id = 2;
  // resource_type is a stable machine-readable type such as
  // "inference_service", "agent", or "job".
  string resource_type = 3;
  string name = 4;
  // status is the lifecycle state reported by the platform.
  string status = 5;
  // namespace is the backing workload namespace, once assigned.
  string namespace = 6;
  // external_url is the public workload URL, once assigned.
  string external_url = 7;
  // spec is the normalized desired state and contains no credentials.
  google.protobuf.Struct spec = 8;
  // status_detail contains non-secret provider/controller status metadata.
  google.protobuf.Struct status_detail = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // location is where the resource runs, such as "eu-1" or "us-1".
  string location = 12;
  // latest_run_id is populated for jobs; use GetJobRun for execution state.
  string latest_run_id = 13;
  // Present on validation previews; this is not a capacity reservation.
  AdmissionAssessment admission = 14;
}

// CreateApiKeyRequest creates an organization-scoped customer credential.
message CreateApiKeyRequest {
  string org_id = 1;
  // label is an optional human-readable purpose for the credential.
  string label = 2;
  // allowed_model_aliases narrows model access. Empty uses the organization
  // policy rather than overriding it. At most 128 aliases may be submitted;
  // duplicate entries still count toward that request limit.
  repeated string allowed_model_aliases = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Up to 128 lowercase model aliases, each containing 3 to 128 ASCII bytes. Empty uses the organization policy rather than overriding it."
    min_length: 3
    max_length: 128
    max_items: 128
    pattern: "^[a-z0-9][a-z0-9._/-]{1,126}[a-z0-9]$"
  }];
  // scopes grants product capabilities. Model scopes are "himalaya",
  // "inference", and "utilities"; "sandboxes" grants code-sandbox access.
  // Empty preserves the historical "inference" default.
  repeated string scopes = 4;
}

// CreateApiKeyResponse contains metadata plus the one-time plaintext secret.
message CreateApiKeyResponse {
  ApiKey api_key = 1;
  // plaintext_key is returned only at creation and cannot be recovered later.
  string plaintext_key = 2;
}

// ListApiKeysRequest selects one organization.
message ListApiKeysRequest {
  string org_id = 1;
}

// ListApiKeysResponse contains redacted credential metadata.
message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

// RevokeApiKeyRequest permanently revokes one organization credential.
message RevokeApiKeyRequest {
  string org_id = 1;
  string api_key_id = 2;
  // revoked_reason is optional operator-visible context and contains no secret.
  string revoked_reason = 3;
}

// RevokeApiKeyResponse contains the credential's final metadata.
message RevokeApiKeyResponse {
  ApiKey api_key = 1;
}

// ApiKey is redacted metadata for a customer credential.
message ApiKey {
  string id = 1;
  string org_id = 2;
  // user_id identifies the identity that created the credential.
  string user_id = 3;
  string label = 4;
  // kind distinguishes customer and future managed credential classes.
  string kind = 5;
  // key_prefix is safe to display and cannot authenticate a request.
  string key_prefix = 6;
  string status = 7;
  repeated string allowed_model_aliases = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp revoked_at = 10;
  string revoked_reason = 11;
  google.protobuf.Timestamp last_used_at = 12;
  repeated string scopes = 13;
}

// GetOrgRequest selects an organization visible to the caller.
message GetOrgRequest {
  string org_id = 1;
}

// UpdateOrgRequest replaces mutable organization metadata.
message UpdateOrgRequest {
  string org_id = 1;
  // name is a non-empty human-readable name of at most 120 characters.
  string name = 2;
}

// GetQuotaPolicyRequest selects an organization visible to the caller.
message GetQuotaPolicyRequest {
  string org_id = 1;
}

// UpdateQuotaPolicyRequest replaces the organization's inference policy.
message UpdateQuotaPolicyRequest {
  string org_id = 1;
  // max_concurrent_requests is unlimited when absent.
  optional int32 max_concurrent_requests = 2;
  // allowed_model_aliases is required when allow_all_models is false. At most
  // 128 aliases may be submitted; duplicate entries still count toward that
  // request limit.
  repeated string allowed_model_aliases = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Up to 128 lowercase model aliases, each containing 3 to 128 ASCII bytes. Required when allow_all_models is false."
    min_length: 3
    max_length: 128
    max_items: 128
    pattern: "^[a-z0-9][a-z0-9._/-]{1,126}[a-z0-9]$"
  }];
  bool allow_all_models = 4;
  // monthly_request_budget is unlimited when absent.
  optional int64 monthly_request_budget = 5;
  // monthly_token_budget is unlimited when absent.
  optional int64 monthly_token_budget = 6;
}

// QuotaPolicy is the effective inference policy for an organization.
message QuotaPolicy {
  string org_id = 1;
  // max_concurrent_requests is unlimited when absent.
  optional int32 max_concurrent_requests = 2;
  repeated string allowed_model_aliases = 3;
  bool allow_all_models = 4;
  // monthly_request_budget is unlimited when absent.
  optional int64 monthly_request_budget = 5;
  // monthly_token_budget is unlimited when absent.
  optional int64 monthly_token_budget = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// GetSpendLimitsRequest selects an organization visible to the caller.
message GetSpendLimitsRequest {
  string org_id = 1;
}

// UpdateSpendLimitsRequest replaces every spend limit of an organization.
// Amounts are microcents of currency: one unit is 0.00000001 of it. A limit
// may be zero, which stops all priced usage it applies to, and at most
// 1,000,000,000,000,000 (10 million in the currency).
message UpdateSpendLimitsRequest {
  string org_id = 1;
  // currency must equal SpendLimits.currency, the organization's billing
  // currency, so an amount is never applied in a currency the caller did not
  // read. A mismatch fails with spend_limit_currency_mismatch.
  string currency = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "The organization's billing currency as GetSpendLimits returns it: \"usd\" or \"eur\"."
    pattern: "^(usd|eur)$"
  }];
  // monthly_limit_microcents caps everything the organization is charged in a
  // UTC calendar month. Absent means no overall limit.
  optional int64 monthly_limit_microcents = 3;
  // product_limits caps single products, each also bounded by the overall
  // limit. A product without an entry draws on the overall limit only. Each
  // product may appear once and must be metered (ProductSpend.metered).
  repeated ProductSpendLimit product_limits = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "At most one entry per metered product."
    max_items: 16
  }];
}

// ProductSpendLimit caps one product's charges in a UTC calendar month.
message ProductSpendLimit {
  // product is a product identifier from the product-access catalog, such as
  // "inference" or "utilities".
  string product = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Product identifier from the product-access catalog."
    max_length: 32
    pattern: "^[a-z][a-z0-9_]{1,31}$"
  }];
  // monthly_limit_microcents is required. A product limit sent without one
  // fails with spend_limit_amount_required rather than reading as zero.
  optional int64 monthly_limit_microcents = 2;
}

// SpendLimits is an organization's monthly spend limits and what it has been
// charged in the current UTC calendar month. Every amount is in microcents of
// currency: one unit is 0.00000001 of it.
message SpendLimits {
  string org_id = 1;
  // currency is the organization's billing currency, "usd" or "eur": that of
  // its live billing account, otherwise "usd".
  string currency = 2;
  // monthly_limit_microcents is absent when there is no overall limit.
  optional int64 monthly_limit_microcents = 3;
  // spent_microcents is what priced usage has been charged since
  // period_start, across every product.
  int64 spent_microcents = 4;
  // products lists every product whose usage is charged or can be, each
  // with its own limit and spend.
  repeated ProductSpend products = 5;
  // period_start is inclusive.
  google.protobuf.Timestamp period_start = 6;
  // period_end is exclusive. Spend counts from zero again from then.
  google.protobuf.Timestamp period_end = 7;
  // updated_at is when the limits last changed. Absent if never set.
  google.protobuf.Timestamp updated_at = 8;
  // as_of is when the spend in this message was measured.
  google.protobuf.Timestamp as_of = 9;
  // held_microcents is what priced calls in flight have reserved: the most
  // each can cost. It counts against the limits, on top of spent_microcents,
  // until those calls finish and are charged what they really cost.
  int64 held_microcents = 10;
}

// ProductSpend is one product's spend limit and what it has been charged.
message ProductSpend {
  // product is a product identifier from the product-access catalog.
  string product = 1;
  // metered is true when the product's usage is charged and its limits are
  // enforced. A product that is not metered cannot take a limit yet.
  bool metered = 2;
  // monthly_limit_microcents is absent when the product has no limit of its
  // own and draws on the overall limit only.
  optional int64 monthly_limit_microcents = 3;
  // spent_microcents is what the product has been charged since
  // period_start.
  int64 spent_microcents = 4;
}

// ListUsageEventsRequest selects recent metering records.
message ListUsageEventsRequest {
  string org_id = 1;
  // limit defaults to 25 and is capped at 100.
  int32 limit = 2;
}

// ListUsageEventsResponse contains records in newest-first order.
message ListUsageEventsResponse {
  repeated UsageEvent usage_events = 1;
}

// UsageEvent is one metered inference request.
message UsageEvent {
  int64 id = 1;
  // request_id correlates the event with the originating request.
  string request_id = 2;
  // model is the customer-facing Tarka alias.
  string model = 3;
  string provider_slug = 4;
  string provider_model = 5;
  int64 prompt_tokens = 6;
  int64 completion_tokens = 7;
  int64 total_tokens = 8;
  int32 status_code = 9;
  int32 latency_ms = 10;
  string request_type = 11;
  // error_code is empty for a successful request.
  string error_code = 12;
  // cost_microcents uses true microcents: one unit is USD 0.00000001.
  int64 cost_microcents = 13;
  google.protobuf.Timestamp created_at = 14;
  double audio_seconds = 15;
  int64 input_pages = 16;
  string access_product = 17;
  string resource_id = 18;
  string pricing_version = 19;
  // Actual ledger amount, in billed_currency microcents, fixed at admission.
  string billed_currency = 20;
  int64 billed_microcents = 21;
  int64 runtime_ms = 22;
}

// GetUsageSummaryRequest selects an organization visible to the caller.
message GetUsageSummaryRequest {
  string org_id = 1;
}

// UsageSummary aggregates metering over a half-open UTC time interval.
message UsageSummary {
  string org_id = 1;
  // period_start is inclusive.
  google.protobuf.Timestamp period_start = 2;
  // period_end is exclusive.
  google.protobuf.Timestamp period_end = 3;
  int64 request_count = 4;
  int64 prompt_tokens = 5;
  int64 completion_tokens = 6;
  int64 total_tokens = 7;
  // cost_microcents uses true microcents: one unit is USD 0.00000001.
  int64 cost_microcents = 8;
  int64 error_count = 9;
  int64 average_latency_ms = 10;
}

// ListProvisionedResourcesRequest selects organization desired-state records.
message ListProvisionedResourcesRequest {
  string org_id = 1;
  // resource_type is an exact filter; empty returns every supported type.
  string resource_type = 2;
}

// ListProvisionedResourcesResponse contains desired-state resources in
// newest-first order.
message ListProvisionedResourcesResponse {
  repeated ProvisionedResource resources = 1;
}

// GetProvisionedResourceRequest selects one organization resource.
message GetProvisionedResourceRequest {
  string org_id = 1;
  string resource_id = 2;
}

// ListLocationsRequest optionally selects an organization so that preview
// locations it may use are included.
message ListLocationsRequest {
  string org_id = 1;
}

// ListLocationsResponse lists placement locations, default first.
message ListLocationsResponse {
  repeated Location locations = 1;
}

// Location is a place where Tarka runs customer workloads and stores data.
// Identifiers are stable and provider-neutral: a location keeps its id if the
// hardware or provider behind it changes.
message Location {
  // id is the stable identifier, such as "eu-1" or "us-1".
  string id = 1;
  // display_name is a human-readable name, such as "Europe (Germany)".
  string display_name = 2;
  // country_code is the ISO 3166-1 alpha-2 country where workloads run.
  string country_code = 3;
  // is_default is true for the location used when a request omits location.
  bool is_default = 4;
  // products lists enabled placement products: "sandboxes", "agent_hosts",
  // "jobs" and "object_storage". A listed location does not by itself grant
  // product access or promise immediately available capacity.
  repeated string products = 5;
  // status is "available", or "preview" when only admitted organizations may
  // place resources here.
  string status = 6;
  // Product-specific placement policy. Legacy resources may remain operable
  // even when accepting_new_resources is false. No field grants entitlement.
  repeated LocationProduct capabilities = 7;
  // False means the country has not yet been verified against provider inventory.
  bool country_verified = 8;
}

message LocationProduct {
  string product = 1;
  bool is_default = 2;
  bool accepting_new_resources = 3;
  bool existing_resources_supported = 4;
  // Stable, non-secret explanation when new placement is unavailable.
  string reason = 5;
}

// CreateStorageBucketRequest defines a private S3-compatible bucket.
message CreateStorageBucketRequest {
  string org_id = 1;
  // name is the customer-visible, URL-safe bucket name within the
  // organization. Tarka maps it to a globally unique physical bucket.
  string name = 2;
  // location selects where the bucket's data is stored, such as "eu-1" or
  // "us-1" (see ListLocations). Empty selects the default location for a new
  // bucket and keeps the current location for an existing one. A bucket
  // cannot move: a different location for an existing name is rejected.
  string location = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Placement location such as \"eu-1\" or \"us-1\" (see ListLocations). Empty selects the default location."
    max_length: 16
    pattern: "^([a-z]{2}-[0-9]{1,3})?$"
  }];
}

// ListStorageBucketsRequest selects one organization.
message ListStorageBucketsRequest {
  string org_id = 1;
}

// ListStorageBucketsResponse contains object-storage bucket metadata.
message ListStorageBucketsResponse {
  repeated StorageBucket buckets = 1;
}

// DeleteStorageBucketRequest selects one organization bucket. The bucket must
// be empty before it can be deleted.
message DeleteStorageBucketRequest {
  string org_id = 1;
  string bucket_id = 2;
}

// StorageBucket describes a private Tarka-managed S3-compatible bucket.
message StorageBucket {
  string id = 1;
  string org_id = 2;
  // name is the customer-visible name, unique within the organization.
  string name = 3;
  // status is the bucket lifecycle/reconciliation state.
  string status = 4;
  // endpoint is the public S3-compatible API endpoint.
  string endpoint = 5;
  // region is the S3 signing region to configure in S3 clients. It is not
  // the Tarka location; see location.
  string region = 6;
  bool versioning_enabled = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // s3_bucket_name is the globally unique bucket identifier to send to S3
  // data-plane clients. name remains the organization-local display name.
  string s3_bucket_name = 10;
  // location is the Tarka location that stores the bucket, such as "eu-1"
  // or "us-1".
  string location = 11;
}

// CreateStorageCredentialRequest creates one access key scoped to a bucket.
message CreateStorageCredentialRequest {
  string org_id = 1;
  string bucket_id = 2;
  // label helps operators distinguish credentials without exposing secrets.
  string label = 3;
}

// CreateStorageCredentialResponse includes the plaintext credential once.
// Tarka does not persist secret_access_key and cannot return it again.
message CreateStorageCredentialResponse {
  StorageCredential credential = 1;
  string access_key_id = 2;
  string secret_access_key = 3;
  string endpoint = 4;
  string region = 5;
}

// ListStorageCredentialsRequest selects one organization bucket.
message ListStorageCredentialsRequest {
  string org_id = 1;
  string bucket_id = 2;
}

// ListStorageCredentialsResponse contains redacted storage credentials.
message ListStorageCredentialsResponse {
  repeated StorageCredential credentials = 1;
}

// RevokeStorageCredentialRequest selects one bucket credential.
message RevokeStorageCredentialRequest {
  string org_id = 1;
  string bucket_id = 2;
  string credential_id = 3;
}

// StorageCredential is redacted metadata for a bucket-scoped S3 access key.
message StorageCredential {
  string id = 1;
  string org_id = 2;
  string bucket_id = 3;
  string label = 4;
  // access_key_prefix is safe to display and identify in the console.
  string access_key_prefix = 5;
  // status is active or revoked.
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp revoked_at = 8;
}

// CreateGitRepositoryRequest defines a private hosted Git repository.
message CreateGitRepositoryRequest {
  string org_id = 1;
  // name is the URL-safe repository name within the organization.
  string name = 2;
  string description = 3;
  // initialize creates the first commit when true.
  bool initialize = 4;
  // default_branch is used when initialize is true; empty selects the platform
  // default.
  string default_branch = 5;
}

// ListGitRepositoriesRequest selects one organization.
message ListGitRepositoriesRequest {
  string org_id = 1;
}

// ListGitRepositoriesResponse contains hosted Git repository metadata.
message ListGitRepositoriesResponse {
  repeated GitRepository repositories = 1;
}

// DeleteGitRepositoryRequest selects one organization repository.
message DeleteGitRepositoryRequest {
  string org_id = 1;
  string repository_id = 2;
}

// GitRepository describes a private Tarka-hosted Git repository.
message GitRepository {
  string id = 1;
  string org_id = 2;
  string name = 3;
  // status is the repository lifecycle/reconciliation state.
  string status = 4;
  string web_url = 5;
  string ssh_clone_url = 6;
  string https_clone_url = 7;
  // lfs_enabled is true when Git LFS support is enforced.
  bool lfs_enabled = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// ListAgentHostTerminalTargetsRequest selects a host visible to the caller.
message ListAgentHostTerminalTargetsRequest {
  string org_id = 1;
  string agent_host_id = 2;
}

// AgentHostTerminalTarget identifies one currently running application container.
// Names are informational, not authority to access arbitrary Kubernetes pods.
message AgentHostTerminalTarget {
  string service = 1;
  string pod_name = 2;
  string container_name = 3;
}

message ListAgentHostTerminalTargetsResponse {
  repeated AgentHostTerminalTarget targets = 1;
}

message CreateAgentHostTerminalRequest {
  string org_id = 1;
  string agent_host_id = 2;
  string pod_name = 3;
  string container_name = 4;
  // auto selects bash when available and otherwise sh. Also accepts sh or bash.
  string shell = 5;
  // Terminal dimensions: 20..400 columns and 5..200 rows; zero uses 100x30.
  uint32 cols = 6;
  uint32 rows = 7;
}

// AgentHostTerminal contains no reusable infrastructure credential. The opaque
// ID is usable only with the same authenticated user, organization, and host.
// Sessions expire after 15 minutes without input or one hour in total; the
// broker can also terminate a session during restart or after 64 MiB of output.
message AgentHostTerminal {
  string terminal_id = 1;
  AgentHostTerminalTarget target = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ReadAgentHostTerminalRequest {
  string org_id = 1;
  string agent_host_id = 2;
  string terminal_id = 3;
  uint64 offset = 4;
  // Zero returns immediately; maximum 20 seconds.
  uint32 wait_seconds = 5;
}

// AgentHostTerminalOutput contains at most 64 KiB of raw PTY output. REST bytes
// are base64 encoded; clients must not interpret output as HTML or log it.
message AgentHostTerminalOutput {
  bytes data = 1;
  uint64 next_offset = 2;
  bool output_lost = 3;
  bool closed = 4;
  int32 exit_code = 5;
  // Stable, non-secret reason such as shell_unavailable, session_expired,
  // output_limit, or connection_closed. An empty value indicates normal exit.
  string error_code = 6;
}

message WriteAgentHostTerminalRequest {
  string org_id = 1;
  string agent_host_id = 2;
  string terminal_id = 3;
  bytes data = 4;
  uint64 input_sequence = 5;
  // Both zero preserves the current size; otherwise the create bounds apply.
  uint32 cols = 6;
  uint32 rows = 7;
}

message WriteAgentHostTerminalResponse {
  uint64 acknowledged_sequence = 1;
}

message CloseAgentHostTerminalRequest {
  string org_id = 1;
  string agent_host_id = 2;
  string terminal_id = 3;
}

message CloseAgentHostTerminalResponse {}

// OrgInvitation excludes the secret token and reports expiry as a status.
message OrgInvitation {
  string id = 1;
  string org_id = 2;
  string org_name = 3;
  string email = 4;
  string role = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}
message CreateOrgInvitationRequest {
  string org_id = 1;
  string email = 2;
  // admin, operator, member, or viewer. Defaults to member.
  string role = 3;
}
message CreateOrgInvitationResponse {
  OrgInvitation invitation = 1;
  // One-time delivery secret. Only its SHA-256 hash is stored.
  string token = 2;
}
message ListOrgInvitationsRequest {
  string org_id = 1;
}
message ListOrgInvitationsResponse {
  repeated OrgInvitation invitations = 1;
}
message RevokeOrgInvitationRequest {
  string org_id = 1;
  string invitation_id = 2;
}
message PreviewOrgInvitationRequest {
  string token = 1;
}
message AcceptOrgInvitationRequest {
  string token = 1;
}

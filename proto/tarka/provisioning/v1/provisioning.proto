syntax = "proto3";

package tarka.provisioning.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tarka/provisioning/v1/agent_secrets.proto";
import "tarka/provisioning/v1/billing_quote.proto";
import "tarka/provisioning/v1/job.proto";

option csharp_namespace = "Tarka.Provisioning.V1";
option go_package = "github.com/TarkaHQ/api/gen/go/tarka/provisioning/v1;provisioningv1";
option java_multiple_files = true;
option java_outer_classname = "ProvisioningProto";
option java_package = "com.tarka.provisioning.v1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Tarka Control API"
    description: "Organization-scoped provisioning, credentials, policy, usage, storage, Hosted Git, and sandbox management."
    version: "1.16.0"
  }
  host: "tarka.rest"
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "bearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer Tarka account access token. Sandbox RPCs also accept a tk_live_ key with the sandboxes scope."
      }
    }
  }
  security: {
    security_requirement: {
      key: "bearerAuth"
      value: {}
    }
  }
};

// ProvisioningService manages Tarka identities, organizations, API keys,
// quotas, metering, object storage, hosted Git, and desired-state compute
// resources.
service ProvisioningService {
  // GetPricingCatalog exposes the active USD retail catalog and currency factors.
  // Public, read-only; never includes credentials or upstream acquisition prices.
  rpc GetPricingCatalog(GetPricingCatalogRequest) returns (PricingCatalog) {
    option (google.api.http) = {get: "/control/v1/pricing"};
  }

  // CreateComputeQuote returns a five-minute quote without reserving funds.
  rpc CreateComputeQuote(CreateComputeQuoteRequest) returns (ComputeQuote) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/compute-quotes"
      body: "*"
    };
  }

  // GetUsagePolicy returns current allowances and an owner acceptance estimate.
  rpc GetUsagePolicy(GetUsagePolicyRequest) returns (UsagePolicy) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/usage-policy"};
  }

  // AcceptUsagePolicy enables prospective charging only after qualification.
  rpc AcceptUsagePolicy(AcceptUsagePolicyRequest) returns (UsagePolicy) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/usage-policy/accept"
      body: "*"
    };
  }

  // GetInferenceCapture returns this organization's optional bucket-capture
  // configuration and recent delivery health. It never exposes internal archives.
  rpc GetInferenceCapture(GetInferenceCaptureRequest) returns (InferenceCapture) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/inference-capture"};
  }

  // UpdateInferenceCapture enables or disables customer-owned capture for all
  // model calls. Requires an organization owner/admin and storage access.
  // Enabling idempotently provisions the organization's inference-history bucket.
  rpc UpdateInferenceCapture(UpdateInferenceCaptureRequest) returns (InferenceCapture) {
    option (google.api.http) = {
      put: "/control/v1/orgs/{org_id}/inference-capture"
      body: "*"
    };
  }

  // GetCurrentUser returns the authenticated identity and its active
  // organization memberships.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (CurrentUser) {
    option (google.api.http) = {get: "/control/v1/me"};
  }

  // BootstrapCurrentUser idempotently creates an initial organization when the
  // authenticated identity does not yet belong to one.
  rpc BootstrapCurrentUser(BootstrapCurrentUserRequest) returns (CurrentUser) {
    option (google.api.http) = {
      post: "/control/v1/me/bootstrap"
      body: "*"
    };
  }

  // CreateOrg creates an additional organization and makes the authenticated
  // identity its owner.
  rpc CreateOrg(CreateOrgRequest) returns (Org) {
    option (google.api.http) = {
      post: "/control/v1/orgs"
      body: "*"
    };
  }

  // RequestProductAccess submits an organization-scoped request for a product
  // that is not yet generally self-service.
  rpc RequestProductAccess(RequestProductAccessRequest) returns (ProductAccessRequest) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/product-access-requests"
      body: "*"
    };
  }

  // ListProductAccessRequests returns recent requests submitted for an
  // organization, optionally filtered by product.
  rpc ListProductAccessRequests(ListProductAccessRequestsRequest) returns (ListProductAccessRequestsResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/product-access-requests"};
  }

  // EnsureHostedGitAccess provisions or reconciles the authenticated user's
  // hosted Git identity.
  rpc EnsureHostedGitAccess(EnsureHostedGitAccessRequest) returns (HostedGitAccess) {
    option (google.api.http) = {
      post: "/control/v1/me/git-access"
      body: "*"
    };
  }

  // ListModels returns active model aliases, optionally filtered by modality.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {get: "/control/v1/models"};
  }

  // CreateInferenceService records desired state for a managed inference
  // service. Reusing an organization, resource type, and name updates it.
  rpc CreateInferenceService(CreateInferenceServiceRequest) returns (ProvisionedResource) {
    option (google.api.http) = {
      post: "/control/v1/inference-services"
      body: "*"
      additional_bindings: {
        post: "/control/v1/orgs/{org_id}/inference-services"
        body: "*"
      }
    };
  }

  // CreateAgentHost applies desired state for a managed multi-service Compose
  // stack or a backward-compatible single-image Agent Host.
  rpc CreateAgentHost(CreateAgentHostRequest) returns (ProvisionedResource) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/agent-hosts"
      body: "*"
    };
  }

  // ListAgentHostTemplates returns the versioned Compose templates published
  // by Tarka. Template definitions never contain runtime secret values.
  rpc ListAgentHostTemplates(ListAgentHostTemplatesRequest) returns (ListAgentHostTemplatesResponse) {
    option (google.api.http) = {get: "/control/v1/agent-host-templates"};
  }

  // GetAgentHostConfiguration returns the editable, redacted configuration for
  // one Agent Host. Secret values are never returned; preserve_existing marks
  // secret references that may be carried into a later revision.
  rpc GetAgentHostConfiguration(GetAgentHostConfigurationRequest) returns (AgentHostConfiguration) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}/configuration"};
  }

  // GetAgentHostGatewayPairing returns a short-lived pairing artifact for a
  // post-deploy messaging gateway. The runtime service remains private to the
  // Agent Host namespace and is never exposed directly to the Internet.
  rpc GetAgentHostGatewayPairing(GetAgentHostGatewayPairingRequest) returns (AgentHostGatewayPairing) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}/gateways/{gateway_id}/pairing"};
  }

  // ListAgentHostTerminalTargets lists running application containers in this
  // host. Platform gateways and initialization containers are excluded.
  rpc ListAgentHostTerminalTargets(ListAgentHostTerminalTargetsRequest) returns (ListAgentHostTerminalTargetsResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}/terminal-targets"};
  }

  // CreateAgentHostTerminal opens a real interactive PTY in a selected running
  // container. Sessions belong to the authenticated user and this host; opening
  // another session never resumes a different user's shell. Requires a resource
  // manager role and active agents access. No command or output is audit logged.
  rpc CreateAgentHostTerminal(CreateAgentHostTerminalRequest) returns (AgentHostTerminal) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}/terminals"
      body: "*"
    };
  }

  // ReadAgentHostTerminal reads bounded raw terminal bytes after a byte offset.
  // It may wait up to 20 seconds for output. Old bytes can be evicted; callers
  // must advance to next_offset and indicate output_lost to the user.
  rpc ReadAgentHostTerminal(ReadAgentHostTerminalRequest) returns (AgentHostTerminalOutput) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}/terminals/{terminal_id}"};
  }

  // WriteAgentHostTerminal sends up to 16 KiB of raw input and/or a PTY resize.
  // Each write uses a strictly increasing input_sequence starting at 1. An exact
  // retry of the last write is acknowledged without replaying its input; a
  // reused sequence with different content or a sequence gap is rejected.
  rpc WriteAgentHostTerminal(WriteAgentHostTerminalRequest) returns (WriteAgentHostTerminalResponse) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}/terminals/{terminal_id}:write"
      body: "*"
    };
  }

  // CloseAgentHostTerminal closes only the caller's session and its exec
  // connection. Expired or already closed sessions are safe to close again.
  // Closing a terminal does not delete the host or its persistent files.
  rpc CloseAgentHostTerminal(CloseAgentHostTerminalRequest) returns (CloseAgentHostTerminalResponse) {
    option (google.api.http) = {delete: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}/terminals/{terminal_id}"};
  }

  // DeleteAgentHost requests deletion of an Agent Host and every namespaced
  // workload owned by it. Retained volume data follows the platform policy.
  rpc DeleteAgentHost(DeleteAgentHostRequest) returns (ProvisionedResource) {
    option (google.api.http) = {delete: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}"};
  }

  // Pausing retains persistent data. Resuming explicitly reserves prepaid credit;
  // topping up alone never resumes a paused host.
  rpc SetAgentHostRunning(SetAgentHostRunningRequest) returns (ProvisionedResource) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/agent-hosts/{agent_host_id}:running"
      body: "*"
    };
  }

  // PrepareAgentHostSecrets returns a console handoff without any secret values.
  rpc PrepareAgentHostSecrets(PrepareAgentHostSecretsRequest) returns (AgentHostSecretBundle) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/agent-host-secret-bundles"
      body: "*"
    };
  }

  // GetAgentHostSecrets returns only the handoff status and key names.
  rpc GetAgentHostSecrets(GetAgentHostSecretsRequest) returns (AgentHostSecretBundle) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/agent-host-secret-bundles/{bundle_id}"};
  }

  // UploadAgentHostSecrets accepts direct authenticated file/console uploads.
  // This write-only method is not offered through MCP.
  rpc UploadAgentHostSecrets(UploadAgentHostSecretsRequest) returns (AgentHostSecretBundle) {
    option (google.api.http) = {
      put: "/control/v1/orgs/{org_id}/agent-host-secret-bundles/{bundle_id}"
      body: "*"
    };
  }

  // CreateJob records a finite job revision and queues its first run atomically.
  // Exact idempotent retries return the original result. A changed revision of
  // an active job is rejected. An accepted response is not execution readiness.
  // The runtime remains feature-gated; unavailable products fail closed.
  rpc CreateJob(CreateJobRequest) returns (ProvisionedResource) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/jobs"
      body: "*"
    };
  }

  // GetJob reads an organization-owned job's current desired state. Listing
  // jobs uses ListProvisionedResources with resource_type="job".
  rpc GetJob(GetJobRequest) returns (ProvisionedResource) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/jobs/{job_id}"};
  }

  // ListJobRuns returns immutable revisions, newest first. A revision may have
  // bounded infrastructure retries, but never overlapping execution attempts.
  rpc ListJobRuns(ListJobRunsRequest) returns (ListJobRunsResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/jobs/{job_id}/runs"};
  }

  // GetJobRun reads execution state without returning customer output.
  rpc GetJobRun(GetJobRunRequest) returns (JobRun) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/jobs/{job_id}/runs/{run_id}"};
  }

  // CancelJobRun is idempotent. STOPPING retains its budget reservation until
  // execution is confirmed stopped. A terminal run is returned unchanged.
  rpc CancelJobRun(CancelJobRunRequest) returns (JobRun) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/jobs/{job_id}/runs/{run_id}:cancel"
      body: "*"
    };
  }

  // GetJobRunResult returns terminal result metadata and an optional signed log
  // download. It rechecks organization and product access on every request.
  rpc GetJobRunResult(GetJobRunResultRequest) returns (JobRunResult) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/jobs/{job_id}/runs/{run_id}/result"};
  }

  // CreateApiKey creates a customer API key. Its plaintext secret is returned
  // exactly once in the response.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/api-keys"
      body: "*"
    };
  }

  // ListApiKeys returns redacted API-key metadata for an organization.
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/api-keys"};
  }

  // RevokeApiKey permanently disables an API key.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/api-keys/{api_key_id}:revoke"
      body: "*"
    };
  }

  // GetOrg returns an active organization visible to the caller.
  rpc GetOrg(GetOrgRequest) returns (Org) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}"};
  }

  // UpdateOrg changes mutable organization metadata.
  rpc UpdateOrg(UpdateOrgRequest) returns (Org) {
    option (google.api.http) = {
      patch: "/control/v1/orgs/{org_id}"
      body: "*"
    };
  }

  // CreateOrgInvitation issues a seven-day invitation or replaces a previous link.
  // Owners may invite admins; owners and admins may invite other non-owner roles.
  // The token is returned once for delivery by a trusted email client. Never log it.
  rpc CreateOrgInvitation(CreateOrgInvitationRequest) returns (CreateOrgInvitationResponse) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/invitations"
      body: "*"
    };
  }
  // ListOrgInvitations returns invitation history to organization administrators.
  rpc ListOrgInvitations(ListOrgInvitationsRequest) returns (ListOrgInvitationsResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/invitations"};
  }
  // RevokeOrgInvitation invalidates an outstanding link.
  rpc RevokeOrgInvitation(RevokeOrgInvitationRequest) returns (OrgInvitation) {
    option (google.api.http) = {delete: "/control/v1/orgs/{org_id}/invitations/{invitation_id}"};
  }
  // PreviewOrgInvitation requires the verified recipient identity. Pending platform
  // accounts may preview and accept; invitations never grant product entitlements.
  rpc PreviewOrgInvitation(PreviewOrgInvitationRequest) returns (OrgInvitation) {
    option (google.api.http) = {
      post: "/control/v1/org-invitations/preview"
      body: "*"
    };
  }
  // AcceptOrgInvitation atomically consumes a link and creates the membership.
  // Retrying with the same recipient is safe and never changes an existing role.
  rpc AcceptOrgInvitation(AcceptOrgInvitationRequest) returns (Org) {
    option (google.api.http) = {
      post: "/control/v1/org-invitations/accept"
      body: "*"
    };
  }

  // ListOrgMembers returns active and inactive memberships visible to an
  // organization member.
  rpc ListOrgMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/members"};
  }

  // GetQuotaPolicy returns an organization's effective inference quota policy.
  rpc GetQuotaPolicy(GetQuotaPolicyRequest) returns (QuotaPolicy) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/quota-policy"};
  }

  // UpdateQuotaPolicy replaces an organization's inference quota policy.
  rpc UpdateQuotaPolicy(UpdateQuotaPolicyRequest) returns (QuotaPolicy) {
    option (google.api.http) = {
      put: "/control/v1/orgs/{org_id}/quota-policy"
      body: "*"
    };
  }

  // GetSpendLimits returns an organization's monthly spend limits and what it
  // has been charged against each in the current UTC calendar month.
  rpc GetSpendLimits(GetSpendLimitsRequest) returns (SpendLimits) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/spend-limits"};
  }

  // UpdateSpendLimits replaces an organization's monthly spend limits. Once a
  // priced request could take spend past a limit that applies to it, the
  // Inference API refuses the request with HTTP 402 and the error code
  // spend_limit_reached.
  rpc UpdateSpendLimits(UpdateSpendLimitsRequest) returns (SpendLimits) {
    option (google.api.http) = {
      put: "/control/v1/orgs/{org_id}/spend-limits"
      body: "*"
    };
  }

  // ListUsageEvents returns the organization's newest metered requests.
  rpc ListUsageEvents(ListUsageEventsRequest) returns (ListUsageEventsResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/usage/events"};
  }

  // GetUsageSummary aggregates the organization's current UTC calendar month.
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (UsageSummary) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/usage/summary"};
  }

  // ListProvisionedResources returns desired-state resources, optionally
  // filtered by resource type.
  rpc ListProvisionedResources(ListProvisionedResourcesRequest) returns (ListProvisionedResourcesResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/resources"};
  }

  // GetProvisionedResource returns one desired-state resource by identifier.
  rpc GetProvisionedResource(GetProvisionedResourceRequest) returns (ProvisionedResource) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/resources/{resource_id}"};
  }

  // ListLocations returns the locations where Tarka can place sandboxes,
  // Agent Hosts and storage buckets, with the products each one offers. With
  // an organization, preview locations that organization may use are
  // included.
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse) {
    option (google.api.http) = {
      get: "/control/v1/locations"
      additional_bindings: {get: "/control/v1/orgs/{org_id}/locations"}
    };
  }

  // CreateStorageBucket provisions a private, versioned S3-compatible bucket.
  rpc CreateStorageBucket(CreateStorageBucketRequest) returns (StorageBucket) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/storage/buckets"
      body: "*"
    };
  }

  // ListStorageBuckets returns object-storage buckets in an organization.
  rpc ListStorageBuckets(ListStorageBucketsRequest) returns (ListStorageBucketsResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/storage/buckets"};
  }

  // DeleteStorageBucket permanently deletes an empty object-storage bucket.
  rpc DeleteStorageBucket(DeleteStorageBucketRequest) returns (StorageBucket) {
    option (google.api.http) = {delete: "/control/v1/orgs/{org_id}/storage/buckets/{bucket_id}"};
  }

  // CreateStorageCredential creates credentials scoped to one bucket. The
  // secret_access_key is returned exactly once in the response.
  rpc CreateStorageCredential(CreateStorageCredentialRequest) returns (CreateStorageCredentialResponse) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/storage/buckets/{bucket_id}/credentials"
      body: "*"
    };
  }

  // ListStorageCredentials returns redacted credential metadata for a bucket.
  rpc ListStorageCredentials(ListStorageCredentialsRequest) returns (ListStorageCredentialsResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/storage/buckets/{bucket_id}/credentials"};
  }

  // RevokeStorageCredential permanently disables a storage credential.
  rpc RevokeStorageCredential(RevokeStorageCredentialRequest) returns (StorageCredential) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/storage/buckets/{bucket_id}/credentials/{credential_id}:revoke"
      body: "*"
    };
  }

  // CreateGitRepository creates a private, LFS-enabled hosted Git repository.
  rpc CreateGitRepository(CreateGitRepositoryRequest) returns (GitRepository) {
    option (google.api.http) = {
      post: "/control/v1/orgs/{org_id}/git-repositories"
      body: "*"
    };
  }

  // ListGitRepositories returns hosted Git repositories in an organization.
  rpc ListGitRepositories(ListGitRepositoriesRequest) returns (ListGitRepositoriesResponse) {
    option (google.api.http) = {get: "/control/v1/orgs/{org_id}/git-repositories"};
  }

  // DeleteGitRepository deletes a hosted Git repository and records its final
  // state.
  rpc DeleteGitRepository(DeleteGitRepositoryRequest) returns (GitRepository) {
    option (google.api.http) = {delete: "/control/v1/orgs/{org_id}/git-repositories/{repository_id}"};
  }
}

// GetInferenceCaptureRequest identifies the organization, not a bucket supplied
// by the caller. Existing organization membership checks apply.
message GetInferenceCaptureRequest {
  string org_id = 1;
}

// UpdateInferenceCaptureRequest replaces the organization-wide capture setting.
// Disabling stops new capture and does not delete existing objects.
message UpdateInferenceCaptureRequest {
  string org_id = 1;
  bool enabled = 2;
  // Zero retains objects until deletion; other supported values are 7, 30, 90.
  int32 retention_days = 3;
}

// InferenceCapture describes customer-controlled S3 delivery, independent of
// Responses store:true and free Himalaya's Tarka-owned evaluation archive.
message InferenceCapture {
  string org_id = 1;
  bool enabled = 2;
  int32 retention_days = 3;
  string bucket_id = 4;
  string bucket_name = 5;
  int64 delivered_last_24h = 6;
  int64 failed_last_24h = 7;
  int64 pending = 8;
  google.protobuf.Timestamp last_delivered_at = 9;
  // A fixed diagnostic code; never includes payload content or storage secrets.
  string last_error_code = 10;
}

// GetCurrentUserRequest has no parameters; identity comes from authentication.
message GetCurrentUserRequest {}

// BootstrapCurrentUserRequest customizes the first organization created for an
// identity. An empty org_name lets the server derive a display name.
message BootstrapCurrentUserRequest {
  // org_name is the initial organization's human-readable name.
  string org_name = 1;
}

// CreateOrgRequest creates an additional organization for the authenticated
// identity. The caller becomes its owner.
message CreateOrgRequest {
  // name is a non-empty human-readable name of at most 120 characters.
  string name = 1;
  // slug is an optional immutable URL-safe identifier. When empty, the server
  // allocates one from the name. Explicit slugs must be globally unique.
  string slug = 2;
}

// RequestProductAccessRequest submits interest in a product that requires an
// entitlement decision. The authenticated caller must be an active member of
// org_id. contact_email defaults to the authenticated account email.
message RequestProductAccessRequest {
  string org_id = 1;
  // product is one of inference, utilities, agents, jobs, sandboxes, storage,
  // or git.
  string product = 2;
  // product_detail identifies the requested tier or product variant when one
  // exists, for example agent_hosts or job_runners.
  string product_detail = 3;
  string contact_email = 4;
  string company = 5;
  string use_case = 6;
}

// ListProductAccessRequestsRequest selects recent organization requests.
message ListProductAccessRequestsRequest {
  string org_id = 1;
  // product optionally filters by the canonical product identifier.
  string product = 2;
  // limit defaults to 25 and is capped at 100.
  int32 limit = 3;
}

// ListProductAccessRequestsResponse contains newest requests first.
message ListProductAccessRequestsResponse {
  repeated ProductAccessRequest requests = 1;
}

// ProductAccessRequest is the durable status of one product-access request.
message ProductAccessRequest {
  string id = 1;
  string org_id = 2;
  string user_id = 3;
  string product = 4;
  string product_detail = 5;
  string contact_email = 6;
  string company = 7;
  string use_case = 8;
  // status is draft, submitted, approved, live, or declined.
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// EnsureHostedGitAccessRequest has no parameters; identity comes from
// authentication.
message EnsureHostedGitAccessRequest {}

// HostedGitAccess describes the caller's hosted Git identity.
message HostedGitAccess {
  // status is the reconciliation state of hosted Git access.
  string status = 1;
  // forgejo_username is the stable username on Tarka's hosted Git service.
  string forgejo_username = 2;
  // web_url opens the hosted Git user interface.
  string web_url = 3;
}

// CurrentUser is the authenticated platform identity and its active
// organization memberships.
message CurrentUser {
  // user_id is the stable platform identity identifier.
  string user_id = 1;
  // email is the identity's current email address, when available.
  string email = 2;
  // orgs contains active organizations in membership creation order.
  repeated Org orgs = 3;
  // default_org_id is the first active organization, or empty when none exists.
  string default_org_id = 4;
  // entitlements contains the caller's current server-authoritative product
  // access decisions. API keys never grant access beyond these decisions.
  repeated ProductEntitlement entitlements = 5;
}

// ProductEntitlement describes one user-level product access decision.
message ProductEntitlement {
  // product is a canonical identifier such as "himalaya", "inference",
  // "utilities", "agents", "jobs", "sandboxes", "storage", or "git".
  string product = 1;
  // status is pending, approved, expired, suspended, or revoked. Expired is
  // an effective status returned when an otherwise-approved grant is past its
  // optional expires_at timestamp.
  string status = 2;
  // approved_at is populated when status is approved.
  google.protobuf.Timestamp approved_at = 3;
  // expires_at is the optional instant after which this grant stops
  // authorizing requests. The server enforces it on every request.
  google.protobuf.Timestamp expires_at = 4;
}

// Org is an organization as visible to the authenticated caller.
message Org {

  string version = 1;
  bool active = 2;
  google.protobuf.Struct catalog = 3;
}

// CreateInferenceServiceRequest defines desired state for an inference service.
message CreateInferenceServiceRequest {
  string org_id = 1;
  // name must be a DNS label and is unique per organization/resource type.
  string name = 2;
  // model_alias must refer to an active entry returned by ListModels.
  string model_alias = 3;
  // min_replicas is the non-negative lower autoscaling bound.
  int32 min_replicas = 4;
  // max_replicas is the non-negative upper autoscaling bound; zero means the
  // platform default.
  int32 max_replicas = 5;
  // spec carries non-secret extension fields. Typed fields take precedence.
  google.protobuf.Struct spec = 6;
}

// CreateAgentHostRequest applies desired state for a complete Agent Host
// Compose stack. Existing single-image callers remain supported and are
// normalized into a one-service stack.
message CreateAgentHostRequest {
  string org_id = 1;
  // name must be a DNS label and is unique per organization/resource type.
  string name = 2;
  // image is a container image reference; embedded credentials are forbidden.
  string image = 3;
  // container_port is the service port; zero selects the platform default.
  int32 container_port = 4;
  int32 min_replicas = 5;
  // max_replicas is the upper bound; zero selects the platform default.
  int32 max_replicas = 6;
  // spec carries non-secret extension fields. Typed fields take precedence.
  google.protobuf.Struct spec = 7;
  // template_id selects a versioned Tarka template such as openclaw, hermes,
  // or onyx. It is mutually exclusive with compose_yaml and image.
  string template_id = 8;
  // compose_yaml contains an inline Compose Specification document. Runtime
  // secret values must be supplied through variables and must not be embedded
  // in this document.
  string compose_yaml = 9;
  // variables supplies Compose interpolation values. Secret values are
  // encrypted separately and never returned in ProvisionedResource.spec.
  repeated AgentHostVariable variables = 10;
  // public_service optionally overrides the service exposed at the stack's
  // generated HTTPS hostname. An x-tarka.routes extension can expose multiple
  // service paths without this override.
  string public_service = 11;
  // public_port is required when public_service is set unless the service has
  // exactly one declared port.
  int32 public_port = 12;
  // tier is the platform capacity profile. Empty selects the beta default.
  string tier = 13;
  // runtime configures Tarka-managed model access, runtime-specific gateway
  // files, and the Compose services that receive the managed environment.
  // It is optional for backward compatibility.
  AgentHostRuntimeConfiguration runtime = 14;
  // github_registry_credentials controls private ghcr.io pulls for custom Compose
  // only. Omission preserves the saved credentials; replacement requires both
  // username and token. Plaintext tokens are write-only and never echoed.
  AgentHostGitHubRegistryCredentials github_registry_credentials = 15;
  // Validate and return spec.billing_quote without creating or changing a host.
  // The quote uses the organization billing currency; admission reserves credit at apply time.
  bool dry_run = 17;
  // Optional for legacy EU clients; binds the normalized allocation at creation.
  string accepted_quote_id = 18;
  // US East Agent Hosts: combined forwarded bytes per renewable five-minute
  // allowance. Omitted uses 1 GiB for a new host and preserves an existing
  // host's allowance. Zero disables public ingress and outbound networking.
  // EU hosts must omit this field; their existing network policy is unchanged.
  optional uint64 max_network_bytes = 19;
  // An uploaded, unexpired bundle bound to this organization, name and revision.
  // Consumed atomically on apply; dry runs may reuse it without consuming it.
  string secrets_bundle_id = 20;
  // location selects where the host runs, such as "eu-1" or "us-1" (see
  // ListLocations). Empty selects the default location for a new host and
  // keeps the current location for an existing one. A host cannot move:
  // changing the location of an existing host is rejected.
  string location = 16 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Placement location such as \"eu-1\" or \"us-1\" (see ListLocations). Empty selects the default location."
    max_length: 16
    pattern: "^([a-z]{2}-[0-9]{1,3})?$"
  }];
}

message SetAgentHostRunningRequest {
  string org_id = 1;
  string agent_host_id = 2;
  bool running = 3;
}

// AgentHostGitHubRegistryCredentials changes this host's ghcr.io credentials.
// A classic GitHub PAT needs read:packages and access to every referenced image.
message AgentHostGitHubRegistryCredentials {
  // username is the token owner's GitHub login, not the package organization.
  string username = 1;
  // token is a write-only classic PAT. It is encrypted before persistence.
  string token = 2;
  // remove clears saved credentials and is mutually exclusive with username/token.
  // The resulting Compose images must be accessible anonymously.
  bool remove = 3;
}

// AgentHostGitHubRegistryAccess contains only non-secret saved credential metadata.
message AgentHostGitHubRegistryAccess {
  string username = 1;
  bool configured = 2;
}

// AgentHostVariable is one Compose interpolation value. Values marked secret
// are accepted once over TLS, encrypted at rest, mounted from Kubernetes
// Secrets, and redacted from all read responses.
message AgentHostVariable {
  string name = 1;
  string value = 2;
  bool secret = 3;
  // preserve_existing reuses the encrypted value from the active revision.
  // It is valid only for secret variables during an update and is returned by
  // GetAgentHostConfiguration when an encrypted value already exists.
  bool preserve_existing = 4;
}

// AgentHostRuntimeConfiguration describes Tarka-managed configuration layered
// onto a Compose stack without exposing the host-bound platform credential.
message AgentHostRuntimeConfiguration {
  // primary_model_alias is an active chat model selected from ListModels.
  // When empty, a new host starts on its template's default model, or the
  // platform default for a stack without a template. An update keeps the
  // model saved in the host's latest revision, and fails if that model is no
  // longer available.
  string primary_model_alias = 1;
  // gateways contains the messaging integrations enabled for this revision.
  repeated AgentHostGatewayConfiguration gateways = 2;
  // platform_services names Compose services that receive managed runtime
  // configuration and non-secret TARKA_* discovery environment variables.
  repeated string platform_services = 3;
}

// AgentHostGatewayConfiguration contains one runtime-specific messaging
// integration. config_yaml contains non-secret advanced settings. Credentials
// are supplied separately through variables and encrypted at rest.
message AgentHostGatewayConfiguration {
  string gateway_id = 1;
  string config_yaml = 2;
  repeated AgentHostVariable variables = 3;
}

// ListAgentHostTemplatesRequest has no parameters. Template visibility is
// controlled by the caller's platform and Agent Hosts entitlements.
message ListAgentHostTemplatesRequest {}

// ListAgentHostTemplatesResponse contains stable template metadata.
message ListAgentHostTemplatesResponse {
  repeated AgentHostTemplate templates = 1;
}

// AgentHostTemplate describes a versioned, platform-tested Compose stack.
message AgentHostTemplate {
  string id = 1;
  string title = 2;
  string description = 3;
  string version = 4;
  int32 service_count = 5;
  repeated AgentHostTemplateVariable variables = 6;
  // tier is the default capacity profile for this template.
  string tier = 7;
  // runtime_profile contains platform-owned defaults for model routing,
  // context management, utilities, and managed Compose services.
  AgentHostRuntimeProfile runtime_profile = 8;
  // gateways lists integrations understood by this template's runtime adapter.
  repeated AgentHostGatewayDefinition gateways = 9;
}

// AgentHostTemplateVariable documents one configurable template value without
// exposing a runtime secret.
message AgentHostTemplateVariable {
  string name = 1;
  string label = 2;
  string description = 3;
  bool secret = 4;
  bool required = 5;
  string default_value = 6;
}

// AgentHostRuntimeProfile advertises immutable managed defaults for a template.
// context and compaction values are enforced by the runtime adapter rather than
// accepted from untrusted Compose or browser input.
message AgentHostRuntimeProfile {
  bool managed_model = 1;
  string default_model_alias = 2;
  int64 context_token_limit = 3;
  int64 compaction_threshold_tokens = 4;
  repeated string utility_modalities = 5;
  repeated string platform_services = 6;
}

// AgentHostGatewayDefinition describes one gateway option rendered by the
// Console. setup_mode is predeploy or postdeploy_pairing.
message AgentHostGatewayDefinition {
  string id = 1;
  string title = 2;
  string description = 3;
  string setup_mode = 4;
  string default_config_yaml = 5;
  repeated AgentHostTemplateVariable variables = 6;
}

// GetAgentHostConfigurationRequest selects one editable Agent Host revision.
message GetAgentHostConfigurationRequest {
  string org_id = 1;
  string agent_host_id = 2;
}

// AgentHostConfiguration is a redacted editable snapshot of the active
// revision. Secret variables have empty values and preserve_existing=true.
message AgentHostConfiguration {
  string agent_host_id = 1;
  int32 revision = 2;
  string name = 3;
  string template_id = 4;
  string template_version = 5;
  string compose_yaml = 6;
  repeated AgentHostVariable variables = 7;
  string public_service = 8;
  int32 public_port = 9;
  string tier = 10;
  AgentHostRuntimeConfiguration runtime = 11;
  // github_registry_access never contains the saved token.
  AgentHostGitHubRegistryAccess github_registry_access = 12;
}

// GetAgentHostGatewayPairingRequest selects a configured post-deploy gateway.
message GetAgentHostGatewayPairingRequest {
  string org_id = 1;
  string agent_host_id = 2;
  string gateway_id = 3;
}

// AgentHostGatewayPairing contains a short-lived artifact generated by the

syntax = "proto3";

package tarka.provisioning.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tarka.Provisioning.V1";
option go_package = "github.com/TarkaHQ/api/gen/go/tarka/provisioning/v1;provisioningv1";
option java_multiple_files = true;
option java_outer_classname = "AgentSecretsProto";
option java_package = "com.tarka.provisioning.v1";

// PrepareAgentHostSecretsRequest starts an authenticated human/file handoff.
// No secret value passes through an MCP tool. The current host revision is
// captured to prevent a later application from overwriting concurrent changes.
message PrepareAgentHostSecretsRequest {
  string org_id = 1;
  string name = 2;
}

message GetAgentHostSecretsRequest {
  string org_id = 1;
  string bundle_id = 2;
}

// UploadAgentHostSecretsRequest is available over HTTPS/gRPC, never MCP.
// Upload from the authenticated console or the local file helper. Values are
// encrypted at rest, never returned, and cannot be replaced after upload.
message UploadAgentHostSecretsRequest {
  string org_id = 1;
  string bundle_id = 2;
  map<string, string> values = 3;
}

// AgentHostSecretBundle contains metadata only. The link does not authorize
// access: the person opening it must authenticate and have organization access.
message AgentHostSecretBundle {
  string id = 1;
  string org_id = 2;
  string name = 3;
  int32 expected_revision = 4;
  repeated string keys = 5;
  // status is awaiting_upload, ready, consumed or expired.
  string status = 6;
  google.protobuf.Timestamp expires_at = 7;
  string console_url = 8;
}

syntax = "proto3";

package tarka.provisioning.v1;

import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option csharp_namespace = "Tarka.Provisioning.V1";
option go_package = "github.com/TarkaHQ/api/gen/go/tarka/provisioning/v1;provisioningv1";
option java_multiple_files = true;
option java_outer_classname = "ProjectSecretsProto";
option java_package = "com.tarka.provisioning.v1";

// ProjectSecret is metadata only. A value is encrypted at rest and is never
// returned by the control API; compute workloads granted the secret read it at
// http://tarka/secrets/{name}.
message ProjectSecret {
  string project_id = 1;
  // An environment variable name: an uppercase letter or underscore, then
  // uppercase letters, digits and underscores.
  string name = 2;
  // Increases with every replaced value.
  uint64 version = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// SetProjectSecretRequest creates or replaces one secret. It is served over
// HTTPS and gRPC only, never as an MCP tool.
message SetProjectSecretRequest {
  string org_id = 1;
  string project_id = 2;
  string name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    max_length: 128
    pattern: "^[A-Z_][A-Z0-9_]{0,127}$"
  }];
  // Up to 64 KiB of UTF-8.
  string value = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    format: "password"
    max_length: 65536
  }];
  // The version last read, or zero to create a secret that does not exist.
  uint64 expected_version = 5;
}

message ListProjectSecretsRequest {
  string org_id = 1;
  string project_id = 2;
}

message ListProjectSecretsResponse {
  repeated ProjectSecret secrets = 1;
}

message DeleteProjectSecretRequest {
  string org_id = 1;
  string project_id = 2;
  string name = 3;
  // The version last read.
  uint64 expected_version = 4;
}
